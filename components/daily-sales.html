<section id="dailySalesContainer" class="daily-sales-module" style="display:none;">
  <div class="ds-page-header">
    <div><div class="ds-eyebrow">OPERATIONS</div><h1><i class="fa-solid fa-chart-line"></i> Daily Sales</h1><p>Capture and manage daily store sales.</p></div>
    <button type="button" class="ds-primary-btn" onclick="dsOpenAdd()"><i class="fa-solid fa-plus"></i> Add Daily Sales</button>
  </div>
  <div id="dailySalesFormWrapper" class="ds-form-wrapper" style="display:none;">
    <div class="ds-card">
      <div class="ds-form-header"><div><div class="ds-eyebrow">DAILY SALES</div><h2 id="dsFormTitle">Add Daily Sales</h2></div><button type="button" class="ds-icon-btn" onclick="dsCloseForm()"><i class="fa-solid fa-xmark"></i></button></div>
      <form id="dailySalesForm" onsubmit="event.preventDefault();dsSave();">
        <div class="ds-section-title">Store Information</div>
        <div class="ds-grid ds-grid-3">
          <div class="ds-field"><label>Daily Sales No</label><input id="dsDailySalesNo" value="Auto Generate" readonly></div>
          <div class="ds-field"><label>Store No <span>*</span></label><select id="dsStoreNo" required><option value="">Select Store No</option></select></div>
          <div class="ds-field"><label>Business Date <span>*</span></label><input id="dsBusinessDate" type="date" required></div>
          <div class="ds-field"><label>Store Name</label><input id="dsStoreName" readonly></div>
          <div class="ds-field"><label>Operating Hour</label><input id="dsOperatingHour" readonly></div>
          <div class="ds-field"><label>Opening Date</label><input id="dsOpeningDate" readonly></div>
          <div class="ds-field"><label>Budget Sales</label><input id="dsBudgetSales" readonly></div>
          <div class="ds-field ds-field-wide"><label>Person In Charge</label><input id="dsPersonInCharge" readonly></div>
        </div>
        <div class="ds-section-title">Sales Information</div>
        <div class="ds-grid ds-grid-4">
          <div class="ds-field"><label>Total Sales</label><input id="dsTotalSales" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Total Merchandise Sales</label><input id="dsTotalMerchandiseSales" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Services</label><input id="dsServices" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Food</label><input id="dsFood" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Beverage</label><input id="dsBeverage" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>General Merchandise</label><input id="dsGeneralMerchandise" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Tobacco</label><input id="dsTobacco" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Supply</label><input id="dsSupply" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Food Service</label><input id="dsFoodService" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Alcoholic</label><input id="dsAlcoholic" type="number" min="0" step="0.01"></div>
          <div class="ds-field"><label>Total Customer</label><input id="dsTotalCustomer" type="number" min="0" step="1"></div>
          <div class="ds-field"><label>Transaction Size</label><input id="dsTransactionSize" value="0.00" readonly></div>
          <div class="ds-field"><label>Percentage</label><input id="dsPercentage" value="0.00%" readonly></div>
        </div>
        <div class="ds-form-actions"><button type="button" class="ds-secondary-btn" onclick="dsCloseForm()">Cancel</button><button id="dsSaveButton" type="submit" class="ds-primary-btn"><i class="fa-solid fa-floppy-disk"></i> Save Daily Sales</button></div>
      </form>
    </div>
  </div>
  <div class="ds-card"><div class="ds-toolbar"><div class="ds-search"><i class="fa-solid fa-magnifying-glass"></i><input id="dsSearch" type="search" placeholder="Search Daily Sales, Store No or Store Name"></div><div id="dsCount" class="ds-count">0 Records</div></div><div class="ds-table-wrap"><table class="ds-table"><thead><tr><th>DS ID</th><th>Daily Sales No</th><th>Store No</th><th>Store Name</th><th>Business Date</th><th>Total Sales</th><th>Person In Charge</th><th>Action</th></tr></thead><tbody id="dsTableBody"><tr><td colspan="8" class="ds-empty">No Daily Sales records.</td></tr></tbody></table></div></div>
</section>
