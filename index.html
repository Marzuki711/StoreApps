<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Manual OT Claim</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ==========================
     Loading
=========================== -->

<div id="loading" class="overlay">

    <div class="loader"></div>

</div>

<!-- ==========================
     Main Container
=========================== -->

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>MANUAL OT CLAIM</h1>

        <p>Overtime Claim Management System</p>

    </div>

    <!-- Employee Type -->

    <div class="card">

        <div class="row">

            <div class="col-12">

                <label>Employee Type</label>

                <select id="employeeType">

                    <option value="">Select Employee Type</option>

                    <option value="Full Timer">
                        Full Timer
                    </option>

                    <option value="Part Timer">
                        Part Timer
                    </option>

                    <option value="Foreign Worker">
                        Foreign Worker
                    </option>

                </select>

            </div>

        </div>

    </div>

    <!-- FULL TIMER -->
    <div id="fullTimerContainer"></div>

    <!-- PART TIMER -->
    <div id="partTimerContainer"></div>

    <!-- FOREIGN WORKER -->
    <div id="foreignWorkerContainer"></div>

</div>

<!-- Success Modal -->

<div id="successModal" class="modal">

    <div class="modal-box">

        <div class="modal-icon">

            ✓

        </div>

        <div class="modal-title">

            Success

        </div>

        <div class="modal-text" id="successText">

            Saved Successfully

        </div>

        <button
        class="btn btn-success"
        onclick="closeSuccess()">

            OK

        </button>

    </div>

</div>

<!-- Validation Modal -->

<div id="validationModal" class="modal">

    <div class="modal-box">

        <div
        class="modal-icon"
        style="background:#F59E0B;">

            !

        </div>

        <div class="modal-title">

            Required Fields

        </div>

        <div
        id="validationList"
        class="modal-text"
        style="text-align:left;margin-top:20px;">

        </div>

        <button
        class="btn btn-success"
        onclick="closeValidation()">

            OK

        </button>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
